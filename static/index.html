<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Check-In/Out</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

    <!-- Main Card Container -->
    <div id="checkin-card" class="card w-full max-w-md p-8 rounded-2xl shadow-2xl text-center transition-all duration-500">
        
        <!-- Header Title -->
        <h1 class="text-4xl font-bold text-gray-800 mb-2">Senior Privs Kiosk</h1>
        <p class="text-gray-600 mb-8">Please check in if you are entering the building, or out if you are leaving.</p>

        <!-- Student ID Input -->
        <div class="mb-8">
            <label for="studentId" class="sr-only">Student ID</label>
            <input type="text" id="studentId" placeholder="Enter Your 5-digit Student ID" class="w-full px-5 py-4 text-lg text-gray-700 bg-gray-100 border-2 border-transparent rounded-xl focus:outline-none focus:ring-4 focus:ring-red-300 focus:bg-white transition duration-300">
        </div>

        <!-- Radio Button Selection -->
        <div class="grid grid-cols-2 gap-4 custom-radio">
            <!-- Check In Option (Green) -->
            <div>
                <input type="radio" id="checkin" name="status" value="in">
                <label for="checkin" class="cursor-pointer bg-green-400 text-white p-6 rounded-xl flex flex-col items-center justify-center hover:bg-green-600 transition">
                    <span class="text-2xl font-bold">IN</span>
                    <span class="text-sm">Check In</span>
                </label>
            </div>
            <!-- Check Out Option (Red) -->
            <div>
                <input type="radio" id="checkout" name="status" value="out">
                <label for="checkout" class="cursor-pointer bg-red-400 text-white p-6 rounded-xl flex flex-col items-center justify-center hover:bg-red-600 transition">
                    <span class="text-2xl font-bold">OUT</span>
                    <span class="text-sm">Check Out</span>
                </label>
            </div>
        </div>
        
        <!-- Dynamic Message Area -->
        <div id="message-area" class="mt-8 text-lg font-medium transition-opacity duration-500 opacity-0 h-8"></div>
    </div>
    <script type="module" src="index.js"></script>

</body>
</html>
